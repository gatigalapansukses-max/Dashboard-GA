<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tigalapan — Asset Control</title>
  <style>
    :root{--orange:#ff7629;--orange2:#ffb57a;--dark:#151c29;--side:#111827;--bg:#f5f7fa;--line:#e7ebf1;--text:#202a39;--muted:#718096;--green:#06875d;--red:#d63f45;--blue:#3478cf;--radius:14px}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
    .loginpage{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 0 0,#3a302d 0,transparent 42%),linear-gradient(135deg,#121a29,#293348);padding:20px}.loginbox{width:min(420px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 24px 100px #0c101a70}.logo{display:flex;align-items:center;gap:11px;font-weight:850;font-size:19px;letter-spacing:-.5px}.mark{background:var(--orange);color:white;border-radius:12px;width:38px;height:38px;display:grid;place-items:center;font-weight:900;font-size:22px}.small{font-size:11px;color:var(--muted)}.muted{color:var(--muted)}.mt{margin-top:24px}.title{font-size:23px;font-weight:850;letter-spacing:-.65px;margin:2px 0 6px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.loginbox label,.form-grid label{display:flex;flex-direction:column;gap:6px;font-weight:650;font-size:12px}.field{border:1px solid #dce2ea;border-radius:9px;padding:11px 12px;background:white;color:var(--text);min-width:0;width:100%}textarea.field{resize:vertical;min-height:80px}.loginbox label{margin-top:17px}
    .btn{border:1px solid transparent;background:var(--orange);color:#fff;border-radius:9px;padding:10px 15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}.btn:hover{filter:brightness(.97)}.btn.outline{background:#fff;color:#333d4e;border-color:#dfe4eb}.btn.dark{background:#1f2937}.btn.danger{background:#fff0f0;color:#ae2432;border-color:#ffd4d4}.btn.tiny{padding:5px 8px;font-size:11px;border-radius:7px}.btn.full{width:100%;margin-top:20px}.error{background:#fff0f0;color:#a52e33;border:1px solid #ffd4d4;border-radius:8px;padding:11px;margin:12px 0}.hide{display:none!important}
    .app{display:flex;min-height:100vh}.sidebar{width:240px;background:var(--side);color:#d8deea;flex-shrink:0;padding:24px 14px;position:sticky;top:0;height:100vh;overflow:auto}.sidebar .logo{padding:0 10px;color:#fff}.sidebar .mark{width:34px;height:34px;font-size:19px}.sideCaption{font-size:10px;color:#76839a;text-transform:uppercase;letter-spacing:1.8px;font-weight:800;margin:29px 12px 11px}.nav{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:10px;color:#abb6c7;margin:3px 0;cursor:pointer;font-weight:650}.nav:hover{background:#202d40;color:white}.nav.active{background:#30343f;color:white;border-left:3px solid var(--orange);padding-left:11px}.navicon{width:20px;text-align:center;color:#ff9d67;font-size:16px}.sidefoot{font-size:11px;color:#99a8bc;padding:18px 13px;border-top:1px solid #2e3a4d;margin-top:25px;line-height:1.8}
    .main{flex:1;min-width:0}.topbar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);min-height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 30px;gap:14px}.topbar h2{font-weight:850;font-size:19px;margin:0}.userpill{display:flex;align-items:center;gap:12px}.avatar{width:34px;height:34px;border-radius:10px;background:#ffe8d9;color:#c15513;display:grid;place-items:center;font-weight:850}.content{padding:26px 30px;max-width:1650px;margin:auto}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}.heading h3{font-size:19px;letter-spacing:-.45px;margin:0 0 5px}.heading p{margin:0;color:var(--muted);font-size:12px}.flex{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#fff;padding:15px;border-radius:12px;border:1px solid var(--line);margin-bottom:18px}.filterbar input,.filterbar select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;min-width:130px;max-width:230px}.filterbar .search{min-width:220px;flex:1}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:18px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 5px #17233e05}.card{padding:20px 19px;position:relative;overflow:hidden}.card:before{content:'';position:absolute;left:0;top:0;height:100%;width:4px;background:var(--orange)}.card .big{font-size:29px;font-weight:850;letter-spacing:-1px;margin:9px 0 2px}.card .kpiLabel{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.45px}.card .tinyNote{color:#9aa4b3;font-size:11px}.card.blue:before{background:#4c83d7}.card.green:before{background:#00a574}.card.red:before{background:#ef5656}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:18px}.panel h4{font-size:14px;margin:0 0 15px}.baritem{display:grid;grid-template-columns:minmax(130px,1fr) 2fr 53px;gap:12px;align-items:center;margin:13px 0}.barlabel{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:10px;border-radius:99px;background:#edf1f5;overflow:hidden}.fill{height:100%;background:var(--orange);border-radius:99px}.fill.green{background:#11a076}.fill.blue{background:#5485da}.fill.red{background:#ed6565}.tablenote{color:#7f8999;font-size:11px;margin:12px 0 0}
    .tablewrap{max-width:100%;overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}.table{border-collapse:collapse;width:100%;white-space:nowrap}.table th{background:#f8fafc;color:#718096;text-align:left;text-transform:uppercase;letter-spacing:.45px;font-size:10px;padding:13px 14px;font-weight:850;border-bottom:1px solid var(--line)}.table td{padding:12px 14px;border-bottom:1px solid #f0f3f7;vertical-align:middle}.table tbody tr:hover{background:#fcf8f4}.table tr:last-child td{border-bottom:none}.table td strong{font-size:12px}.table td small{display:block;color:#8791a0;font-size:10px;margin-top:2px;max-width:260px;overflow:hidden;text-overflow:ellipsis}.tag{border-radius:99px;padding:5px 9px;font-size:10px;font-weight:800;display:inline-block;background:#f0f2f6;color:#647084}.tag.ok{background:#e7f8f1;color:#078455}.tag.warn{background:#fff0de;color:#bc6b08}.tag.bad{background:#ffe9ea;color:#be2d3b}.tag.info{background:#e8f1ff;color:#3475bd}.empty{padding:50px 18px;text-align:center;color:var(--muted)}.empty span{font-size:35px;display:block;margin-bottom:8px}.linkbtn{background:none;border:0;color:#df6829;font-weight:750;padding:4px;cursor:pointer}.mutedline{background:#fff7ed;border-left:3px solid var(--orange);padding:11px 13px;border-radius:7px;font-size:12px;color:#9b621e;margin:12px 0}.pill{background:#f3f6f9;padding:7px 10px;border-radius:8px;font-size:11px}
    .overlay{position:fixed;inset:0;background:#121a29a8;z-index:20;display:grid;place-items:center;padding:12px;overflow:auto}.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 25px 100px #070e1966}.modal-head{padding:20px 23px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0;font-size:18px}.modalbody{padding:22px 23px}.modalfoot{padding:14px 23px;background:#f8fafc;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.form-grid .wide{grid-column:1/-1}.xbtn{border:0;background:none;color:#8c98a6;font-size:22px;cursor:pointer}.notice{position:fixed;right:20px;bottom:20px;background:#1d2b3a;color:white;box-shadow:0 16px 35px #11182750;padding:14px 18px;border-radius:12px;max-width:370px;z-index:30;font-weight:600;line-height:1.5}.notice.err{background:#a92332}.indicator{display:inline-block;width:8px;height:8px;background:#15ae79;border-radius:100%;margin-right:6px}.soqty{width:85px!important;min-width:0!important}.so-note{min-width:150px!important}.mobileToggle{display:none}
    @media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.panels{grid-template-columns:1fr}.sidebar{width:208px}.content{padding:20px}.topbar{padding:12px 20px}}
    @media(max-width:700px){.sidebar{position:fixed;z-index:12;transform:translateX(-105%);transition:.2s;width:255px}.sidebar.open{transform:none}.mobileToggle{display:block}.topbar{padding:10px 15px}.content{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:14px}.card .big{font-size:23px}.form-grid{grid-template-columns:1fr}.panel{padding:15px}.userpill .small{display:none}.heading h3{font-size:17px}.filterbar select,.filterbar input{max-width:100%;flex:1}.baritem{grid-template-columns:1fr 1.5fr 42px}}
  </style>
</head>
<body>
<div id="root"><div class="loginpage"><div class="loginbox"><div class="logo"><span class="mark">38</span>TIGALAPAN <span style="color:#ff7629">ASSET</span></div><p class="sub">Memuat aplikasi manajemen aset...</p></div></div></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
'use strict';
const S={token:sessionStorage.getItem('tiga_asset_token')||'',user:null,data:null,view:'dashboard',filter:{branch:'ALL',q:'',category:'ALL',condition:'ALL',status:'ALL',period:'',from:'',to:''},soDetail:null};
const menu=[['dashboard','◫','Dashboard'],['assets','▦','Master Aset'],['statuses','◉','Status Aset'],['loans','⇄','Peminjaman'],['transfers','⇢','Transfer Aset'],['conditions','☑','Validasi Kondisi'],['so','▣','Stock Opname'],['maintenance','⚒','Maintenance'],['audit','◷','Audit Log'],['users','♙','Pengguna']];
const $=s=>document.querySelector(s),fmt=n=>new Intl.NumberFormat('id-ID').format(Number(n)||0),rp=n=>n===''?'—':'Rp '+fmt(n);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eattr=esc;const dstr=s=>s?String(s).slice(0,10):'—';const dateNow=()=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Makassar',day:'2-digit',month:'2-digit',year:'numeric'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day;};
const condOptions=['BAGUS','LAYAK PAKAI','TIDAK LAYAK PAKAI','RUSAK','BELUM DIPERIKSA'];
function call(name,...args){return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err?.message||String(err))))[name](...args)});}
function toast(t,error=false){const div=document.createElement('div');div.className='notice'+(error?' err':'');div.textContent=t;$('#toastRoot').append(div);setTimeout(()=>div.remove(),4700);}
function fail(err){const msg=err?.message||String(err);toast(msg,true);if(/Sesi berakhir|Akun tidak aktif/.test(msg)){S.token='';sessionStorage.removeItem('tiga_asset_token');loginPage();}}
function busy(button,flag){if(button){button.disabled=flag;button.dataset.oldText??=button.innerHTML;button.innerHTML=flag?'Memproses...':button.dataset.oldText;}}
function loginPage(){
  $('#root').innerHTML=`<div class="loginpage"><div class="loginbox"><div class="logo"><span class="mark">38</span>TIGALAPAN <span style="color:var(--orange)">ASSET</span></div><h2 class="title mt">Asset Control Center</h2><p class="sub">Satu sistem untuk monitoring, peminjaman, mutasi, kondisi, dan stock opname aset seluruh lokasi.</p><form id="loginform"><label>Username<input class="field" name="username" required autocomplete="username" placeholder="Contoh: admin"></label><label>Password<input type="password" class="field" name="password" autocomplete="current-password" required placeholder="Password akun"></label><div id="loginerror" class="hide error"></div><button class="btn full" type="submit">Masuk ke Dashboard →</button></form><p class="sub" style="margin-top:25px">Akun toko dibuat oleh GA/Admin. Seluruh aktivitas tersimpan dalam audit log.</p></div></div>`;
  $('#loginform').onsubmit=async ev=>{ev.preventDefault();const b=ev.target.querySelector('button');busy(b,true);try{const f=Object.fromEntries(new FormData(ev.target));const r=await call('apiLogin',f.username,f.password);S.token=r.token;sessionStorage.setItem('tiga_asset_token',r.token);await refresh();}catch(e){$('#loginerror').textContent=e.message;$('#loginerror').classList.remove('hide');}finally{busy(b,false);}};
}
async function refresh(){S.data=await call('apiBootstrap',S.token);S.user=S.data.user;if(S.user.role==='STORE')S.filter.branch=S.user.branch;draw();}
function isManager(){return ['ADMIN','GA'].includes(S.user.role)}function isAdmin(){return S.user.role==='ADMIN'}function canOperate(){return S.user.role!=='AUDITOR'}
function draw(){
  const showMenus=menu.filter(x=>!((x[0]==='users'&&!isAdmin())||(x[0]==='audit'&&!isManager())));
  $('#root').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="logo"><span class="mark">38</span><div>TIGALAPAN<div class="small" style="color:#ffb389;letter-spacing:1.6px">ASSET CONTROL</div></div></div><div class="sideCaption">Workspace</div>${showMenus.map(m=>`<div class="nav ${S.view===m[0]?'active':''}" data-menu="${m[0]}"><span class="navicon">${m[1]}</span>${m[2]}</div>`).join('')}<div class="sidefoot"><span class="indicator"></span>Database terkoneksi<br>Role: ${esc(S.user.role)}<br>Lokasi: ${esc(S.user.branch)}</div></aside><div class="main"><div class="topbar"><div class="flex"><button class="btn outline mobileToggle" data-act="nav">☰</button><div><div class="small">TIGALAPAN INDONESIA / ASSET MANAGEMENT</div><h2>${esc(showMenus.find(x=>x[0]===S.view)?.[2]||'Dashboard')}</h2></div></div><div class="userpill"><div class="avatar">${esc(S.user.displayName.slice(0,1).toUpperCase())}</div><div><b>${esc(S.user.displayName)}</b><div class="small">${esc(S.user.role)} · ${esc(S.user.branch)}</div></div><button data-act="profile" class="btn outline tiny">Akun</button><button data-act="logout" class="btn outline tiny">Keluar</button></div></div><div id="content" class="content"></div></div></div>`;
  renderView();
}
function renderView(){
 const views={dashboard:renderDashboard,assets:renderAssets,statuses:renderStatuses,loans:renderLoans,transfers:renderTransfers,conditions:renderConditions,so:renderSO,maintenance:renderMaintenance,audit:renderAudit,users:renderUsers};
 (views[S.view]||renderDashboard)();
}
function setView(v){S.view=v;S.soDetail=null;draw();}
function header(title,description,buttons=''){return `<div class="heading"><div><h3>${title}</h3><p>${description}</p></div><div class="flex">${buttons}</div></div>`;}
function optionList(list,current){return list.map(x=>`<option value="${eattr(x)}" ${x===current?'selected':''}>${esc(x)}</option>`).join('');}
function filterBar(){
 const branches=S.user.role==='STORE'?[S.user.branch]:['ALL',...S.data.branches];
 const cats=['ALL',...new Set(S.data.assets.map(x=>x.category))].sort((a,b)=>a==='ALL'?-1:a.localeCompare(b));
 return `<div class="filterbar"><input class="search" id="f-q" value="${eattr(S.filter.q)}" placeholder="⌕ Cari ID, nama, merek, posisi..."><select id="f-branch" ${S.user.role==='STORE'?'disabled':''}>${optionList(branches,S.filter.branch)}</select><select id="f-cat">${optionList(cats,S.filter.category)}</select><select id="f-cond">${optionList(['ALL',...condOptions],S.filter.condition)}</select><select id="f-status">${optionList(['ALL','AKTIF','PERBAIKAN','TIDAK AKTIF','PERLU VERIFIKASI','DIPINDAHKAN'],S.filter.status)}</select><input id="f-period" type="month" value="${eattr(S.filter.period)}" title="Filter bulan & tahun update"><input id="f-from" type="date" value="${eattr(S.filter.from)}" title="Tanggal update dari"><input id="f-to" type="date" value="${eattr(S.filter.to)}" title="Tanggal update sampai"><button class="btn outline tiny" data-act="clearfilters">Reset</button><span class="small">Rentang tanggal = pembaruan terakhir aset</span></div>`;
}
function filteredAssets(){let a=S.data.assets;
 if(S.filter.branch!=='ALL')a=a.filter(x=>x.branch===S.filter.branch);
 if(S.filter.category!=='ALL')a=a.filter(x=>x.category===S.filter.category);
 if(S.filter.condition!=='ALL')a=a.filter(x=>x.condition===S.filter.condition);
 if(S.filter.status!=='ALL')a=a.filter(x=>x.status===S.filter.status);
 if(S.filter.period)a=a.filter(x=>dstr(x.updatedAt).slice(0,7)===S.filter.period);
 if(S.filter.from)a=a.filter(x=>dstr(x.updatedAt)>=S.filter.from);
 if(S.filter.to)a=a.filter(x=>dstr(x.updatedAt)<=S.filter.to);
 if(S.filter.q){const q=S.filter.q.toLocaleLowerCase('id-ID');a=a.filter(x=>[x.id,x.name,x.brand,x.branch,x.category,x.position,x.owner,x.serialNo,x.registrationNo].some(v=>String(v||'').toLocaleLowerCase('id-ID').includes(q)));}
 return a;
}
function paintFilterInputs(){
 $('#f-q')?.addEventListener('input',ev=>{S.filter.q=ev.target.value;renderView();const el=$('#f-q');if(el){el.focus();el.setSelectionRange(S.filter.q.length,S.filter.q.length);}});
 [['f-branch','branch'],['f-cat','category'],['f-cond','condition'],['f-status','status'],['f-period','period'],['f-from','from'],['f-to','to']].forEach(([id,key])=>$('#'+id)?.addEventListener('change',ev=>{S.filter[key]=ev.target.value;renderView();}));
}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty"><span>⌕</span>Tidak ada data sesuai filter</td></tr>`}</tbody></table></div>`;}
function tag(x){const s=String(x||'').toUpperCase();const cls=/RUSAK|TERLAMBAT|DITOLAK|TIDAK LAYAK|DIBATALKAN/.test(s)?'bad':/BELUM|MENUNGGU|DIAJUKAN|PERLU|DILAPORKAN|DALAM PENGIRIMAN/.test(s)?'warn':/BAGUS|AKTIF|SELESAI|DISETUJUI|DITERIMA|DIKEMBALIKAN/.test(s)?'ok':'info';return `<span class="tag ${cls}">${esc(x||'—')}</span>`;}
function available(assetId){const asset=S.data.assets.find(x=>x.id===assetId);if(!asset)return 0;const loans=S.data.loans.filter(x=>x.assetId===assetId&&x.status==='DIPINJAM').reduce((a,x)=>a+Number(x.qty),0);const transfers=S.data.transfers.filter(x=>x.assetId===assetId&&['MENUNGGU PERSETUJUAN','DISETUJUI','DALAM PENGIRIMAN'].includes(x.status)).reduce((a,x)=>a+Number(x.qty),0);return Math.max(0,Number(asset.qty)-loans-transfers);}
function assetOpt(branchOnly=true){return S.data.assets.filter(x=>Number(x.qty)>0&&x.status!=='DIPINDAHKAN'&&(S.filter.branch==='ALL'||!branchOnly||x.branch===S.filter.branch)).map(x=>`<option value="${eattr(x.id)}">${esc(x.id)} · ${esc(x.name)} (${fmt(x.qty)} unit | ${esc(x.branch)})</option>`).join('');}
function kpi(label,value,note,style=''){return `<div class="card ${style}"><div class="kpiLabel">${label}</div><div class="big">${value}</div><div class="tinyNote">${note}</div></div>`;}
function bars(items,max=8,color=''){const ordered=[...items].sort((a,b)=>b[1]-a[1]).slice(0,max),denom=Math.max(1,...ordered.map(x=>x[1]));return ordered.map(([k,v])=>`<div class="baritem"><div class="barlabel" title="${eattr(k)}">${esc(k)}</div><div class="track"><div class="fill ${color}" style="width:${Math.max(0,v/denom*100).toFixed(2)}%"></div></div><b style="text-align:right">${fmt(v)}</b></div>`).join('')||'<p class="muted">Belum ada data.</p>';}
function groupSum(rows,key){return Object.entries(rows.reduce((o,x)=>(o[x[key]||'BELUM DIISI']=(o[x[key]||'BELUM DIISI']||0)+Number(x.qty||0),o),{}));}
function renderDashboard(){const assets=filteredAssets(),qty=assets.reduce((n,x)=>n+Number(x.qty),0),
  bad=assets.filter(x=>/RUSAK|TIDAK LAYAK/i.test(x.condition)).reduce((n,x)=>n+Number(x.qty),0),
  unknown=assets.filter(x=>!x.registrationNo).length,
  overdue=S.data.loans.filter(x=>x.status==='DIPINJAM'&&x.dueDate<dateNow()).length,
  pending=S.data.transfers.filter(x=>!['DITERIMA','DITOLAK','DIBATALKAN'].includes(x.status)).length;
 $('#content').innerHTML=header('Executive Dashboard','Ringkasan aset perusahaan, risiko, dan tindak lanjut secara real-time',`<button class="btn outline" data-act="export">↓ Export CSV</button>`)+filterBar()+
 `<div class="cards">${kpi('Total Kelompok Aset',fmt(assets.length),'Setiap baris aset mendapat 1 ID')}${kpi('Total Unit Terdata',fmt(qty),'Akumulasi kolom QTY','blue')}${kpi('Unit Rusak / Tidak Layak',fmt(bad),'Memerlukan pemeriksaan kondisi','red')}${kpi('Belum Punya Nomor FAT',fmt(unknown)+' baris','Registrasi perlu dilengkapi','green')}</div>
 <div class="cards">${kpi('Peminjaman Terlambat',fmt(overdue),'Pinjam aktif melewati due date','red')}${kpi('Transfer Belum Selesai',fmt(pending),'Request sampai diterima','blue')}${kpi('Validasi Menunggu',fmt(S.data.conditions.filter(x=>x.status==='MENUNGGU').length),'Laporan kondisi toko','')}${kpi('SO Menunggu Review',fmt(S.data.so.filter(x=>x.status==='DIAJUKAN').length),'Perlu persetujuan GA','green')}</div>
 <div class="panels"><div class="panel"><h4>Distribusi Unit per Lokasi</h4>${bars(groupSum(assets,'branch'),10)}</div><div class="panel"><h4>Kondisi Aset (unit)</h4>${bars(groupSum(assets,'condition'),8,'green')}<h4 style="margin-top:26px">Kategori Aset</h4>${bars(groupSum(assets,'category'),8,'blue')}</div></div>
 <p class="tablenote">Catatan: angka menunjukkan unit dan baris inventaris, bukan penilaian akuntansi. Filter tanggal merujuk ke pembaruan terakhir, bukan tanggal beli atau histori stok pada tanggal tersebut.</p>`;paintFilterInputs();}

 if(action==='newLoan'){openLoan();return;}if(action==='returnLoan'){await actAsync(()=>call('apiReturnLoan',S.token,id,prompt('Keterangan pengembalian (opsional):')||''),'Konfirmasi aset sudah dikembalikan?');return;}
 if(action==='newTransfer'){openTransfer();return;}if(action==='transfer'){await actAsync(()=>call('apiAdvanceTransfer',S.token,id,val),`Konfirmasi perubahan transfer ${id} (${val})?`);return;}
 if(action==='newCondition'){openCondition();return;}if(action==='conditionApprove'||action==='conditionReject'){await actAsync(()=>call('apiReviewCondition',S.token,id,action==='conditionApprove'),`Konfirmasi ${action==='conditionApprove'?'persetujuan':'penolakan'} validasi ini?`);return;}
 if(action==='newSO'){openSOCreate();return;}if(action==='openSO'){await openSO(id);return;}if(action==='closeSO'){S.soDetail=null;renderSO();return;}
 if(action==='saveSO'){await actAsync(async()=>{await call('apiSaveSOCounts',S.token,S.soDetail.so.id,soCounts());S.soDetail=await call('apiSOItems',S.token,S.soDetail.so.id);});return;}
 if(action==='submitSO'){await actAsync(async()=>{await call('apiSaveSOCounts',S.token,S.soDetail.so.id,soCounts());await call('apiSubmitSO',S.token,S.soDetail.so.id);S.soDetail=null;},'Ajukan hasil SO ke GA? Setelah diajukan, data tidak dapat diubah.');return;}
 if(action==='approveSO'){await actAsync(async()=>{await call('apiApproveSO',S.token,S.soDetail.so.id);S.soDetail=null;},'Setujui SO? Selisih qty akan langsung memperbarui master aset dan tercatat di audit log.');return;}
 if(action==='newMaintenance'){openMaintenance();return;}if(action==='editMaintenance'){openMaintenance(id);return;}
 if(action==='newUser'){openUser();return;}if(action==='editUser'){openUser(id);return;}
});
(async()=>{if(S.token){try{await refresh();return;}catch(e){sessionStorage.removeItem('tiga_asset_token');S.token='';}}loginPage();})();
</script>
</body>
